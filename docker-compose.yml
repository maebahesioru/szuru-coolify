services:
  server:
    image: szurubooru/server:latest
    depends_on:
      - sql
    restart: unless-stopped
    environment:
      POSTGRES_HOST: sql
      POSTGRES_USER: szuru
      POSTGRES_PASSWORD: c58283e2d441060a36c0d92d7d90a328
      THREADS: "4"
    command:
      - "/bin/sh"
      - "-c"
      - "sed -i \"s/'posts:create:anonymous':.*/'posts:create:anonymous': anonymous/\" /opt/app/config.yaml.dist && sed -i \"s/'comments:create':.*/'comments:create': anonymous/\" /opt/app/config.yaml.dist && sed -i \"s/'tags:create':.*/'tags:create': anonymous/\" /opt/app/config.yaml.dist && sed -i \"s/'uploads:create':.*/'uploads:create': anonymous/\" /opt/app/config.yaml.dist && exec /opt/app/docker-start.sh"
    volumes:
      - szuru_data:/data

  promote-admin:
    image: postgres:11-alpine
    depends_on:
      server:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "sleep 8 && PGPASSWORD=c58283e2d441060a36c0d92d7d90a328 psql -h sql -U szuru -d szuru -c \"UPDATE \\\"user\\\" SET rank='administrator' WHERE name='maebahesioru';\" && echo 'ADMIN PROMOTED!'"
    restart: "no"

  client:
    image: szurubooru/client:latest
    depends_on:
      - server
    restart: unless-stopped
    environment:
      BACKEND_HOST: server
      BASE_URL: /
    volumes:
      - szuru_data:/data:ro

  sql:
    image: postgres:11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: szuru
      POSTGRES_PASSWORD: c58283e2d441060a36c0d92d7d90a328
    volumes:
      - szuru_sql:/var/lib/postgresql/data

volumes:
  szuru_data:
  szuru_sql:

