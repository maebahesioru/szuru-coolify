services:
  server:
    image: szurubooru/server:latest
    depends_on:
      - sql
    restart: unless-stopped
    environment:
      POSTGRES_HOST: sql
      POSTGRES_USER: szuru
      POSTGRES_PASSWORD: c58283e2d441060a36c0d92d7d90a328
      THREADS: "4"
    command:
      - "/bin/sh"
      - "-c"
      - |
        sed -i "s/'posts:create:anonymous':.*/'posts:create:anonymous': anonymous/" /opt/app/config.yaml.dist
        sed -i "s/'comments:create':.*/'comments:create': anonymous/" /opt/app/config.yaml.dist
        sed -i "s/'comments:list':.*/'comments:list': anonymous/" /opt/app/config.yaml.dist
        sed -i "s/'comments:view':.*/'comments:view': anonymous/" /opt/app/config.yaml.dist
        sed -i "s/'comments:score':.*/'comments:score': anonymous/" /opt/app/config.yaml.dist
        sed -i "s/'tags:create':.*/'tags:create': anonymous/" /opt/app/config.yaml.dist
        sed -i "s/'tags:list':.*/'tags:list': anonymous/" /opt/app/config.yaml.dist
        sed -i "s/'users:list':.*/'users:list': anonymous/" /opt/app/config.yaml.dist
        sed -i "s/'posts:edit:tags':.*/'posts:edit:tags': anonymous/" /opt/app/config.yaml.dist
        sed -i "s/'pools:create':.*/'pools:create': anonymous/" /opt/app/config.yaml.dist
        sed -i "s/'uploads:create':.*/'uploads:create': anonymous/" /opt/app/config.yaml.dist
        exec /opt/app/docker-start.sh
    volumes:
      - szuru_data:/data

  promote-admin:
    image: postgres:11-alpine
    depends_on:
      server:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 10
        cat > /tmp/promote.sql << 'SQLEOF'
        UPDATE "user" SET rank='administrator' WHERE name='maebahesioru';
        DELETE FROM post_tag WHERE post_id IN (1, 2);
        DELETE FROM post WHERE id IN (1, 2);
        SQLEOF
        PGPASSWORD=c58283e2d441060a36c0d92d7d90a328 psql -h sql -U szuru -d szuru -f /tmp/promote.sql
        echo '=== PROMOTE + CLEANUP DONE ==='
    restart: "no"

  client:
    image: szurubooru/client:latest
    depends_on:
      - server
    restart: unless-stopped
    environment:
      BACKEND_HOST: server
      BASE_URL: /
    volumes:
      - szuru_data:/data:ro

  sql:
    image: postgres:11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: szuru
      POSTGRES_PASSWORD: c58283e2d441060a36c0d92d7d90a328
    volumes:
      - szuru_sql:/var/lib/postgresql/data

volumes:
  szuru_data:
  szuru_sql:

