services:
  server:
    image: szurubooru/server:latest
    depends_on:
      - sql
    restart: unless-stopped
    environment:
      POSTGRES_HOST: sql
      POSTGRES_USER: szuru
      POSTGRES_PASSWORD: c58283e2d441060a36c0d92d7d90a328
      THREADS: "4"
      CONFIG_YAML_B64: 
    entrypoint: ["/usr/bin/dumb-init", "/bin/sh", "-c"]
    command: ["echo \"$CONFIG_YAML_B64\" | base64 -d > /opt/app/config.yaml && exec /opt/app/docker-start.sh"]
    volumes:
      - szuru_data:/data

  client:
    image: szurubooru/client:latest
    depends_on:
      - server
    restart: unless-stopped
    environment:
      BACKEND_HOST: server
      BASE_URL: /
    volumes:
      - szuru_data:/data:ro

  sql:
    image: postgres:11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: szuru
      POSTGRES_PASSWORD: c58283e2d441060a36c0d92d7d90a328
    volumes:
      - szuru_sql:/var/lib/postgresql/data

volumes:
  szuru_data:
  szuru_sql:

